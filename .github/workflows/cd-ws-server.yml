name: Deploying the ws-server to AWS EC2

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.ws-server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/week-27-ws-server:latest
            ${{ secrets.DOCKER_USERNAME }}/week-27-ws-server:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/week-27-ws-server:latest

            docker stop ws-server || true
            docker rm ws-server || true

            docker run -d \
              --name ws-server \
              -p 8081:8081 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ${{ secrets.DOCKER_USERNAME }}/week-27-ws-server:latest