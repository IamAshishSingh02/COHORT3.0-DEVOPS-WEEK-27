name: Deploying the http-server to AWS EC2

on:
  push: 
    branches: ['main']

jobs: 
  build: 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker Login
        uses: docker/login-action@v2
        with: 
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}

      - name: Build and push
        uses: docker/build-push-action@v4
        with: 
          context: .
          file: ./docker/Dockerfile.http-server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/week-27-http-server:latest
            ${{secrets.DOCKER_USERNAME}}/week-27-http-server:${{github.sha}}

      - name: Run Prisma Migrations
        run: pnpm --filter @repo/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/week-27-http-server:latest

            docker stop http-server || true
            docker rm http-server || true

            docker run -d \
              --name http-server \
              -p 8080:8080 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ${{ secrets.DOCKER_USERNAME }}/week-27-http-server:latest